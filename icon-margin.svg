<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgMargin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2B1D"/>
      <stop offset="100%" stop-color="#0F1117"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="108" fill="url(#bgMargin)"/>
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="#10B981" stroke-width="8" opacity="0.8"/>
  
  <!-- Upward Trend Chart Icon -->
  <rect x="135" y="130" width="242" height="205" rx="18" fill="#064E3B" stroke="#34D399" stroke-width="5"/>
  <!-- Bars -->
  <rect x="165" y="240" width="36" height="65" rx="6" fill="#10B981"/>
  <rect x="215" y="200" width="36" height="105" rx="6" fill="#34D399"/>
  <rect x="265" y="165" width="36" height="140" rx="6" fill="#6EE7B7"/>
  <rect x="315" y="220" width="36" height="85" rx="6" fill="#10B981"/>
  <!-- Trend Line -->
  <polyline points="183,230 233,185 283,150 333,195" fill="none" stroke="#FBBF24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="333,185 348,198 338,206" fill="#FBBF24"/>

  <!-- Badge Top Right (Percent symbol) -->
  <circle cx="380" cy="135" r="46" fill="#059669" stroke="#FFFFFF" stroke-width="4"/>
  <text x="380" y="152" font-family="Segoe UI, Arial, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle">%</text>

  <!-- Pill Tab Name -->
  <rect x="131" y="392" width="250" height="68" rx="34" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="3"/>
  <text x="256" y="440" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="34" fill="#FFFFFF" text-anchor="middle">MARGIN</text>
</svg>
