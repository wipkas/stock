<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradPrint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082F49"/>
      <stop offset="50%" stop-color="#0C4A6E"/>
      <stop offset="100%" stop-color="#031E30"/>
    </linearGradient>
    <linearGradient id="printerBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadowPrint" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background App Icon Shape (Squircle 512x512) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradPrint)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#0284C7" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Printer & Document Artwork -->
  <g filter="url(#shadowPrint)">
    <!-- Top Paper Sheet (Feeding / Emerging) -->
    <path d="M 176 110 L 336 110 L 336 195 L 176 195 Z" fill="url(#paperGrad)" stroke="#94A3B8" stroke-width="2"/>
    <!-- Lines on top paper -->
    <line x1="200" y1="135" x2="312" y2="135" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <line x1="200" y1="155" x2="280" y2="155" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="200" y1="175" x2="295" y2="175" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>

    <!-- Printer Main Body -->
    <rect x="120" y="185" width="272" height="135" rx="18" fill="url(#printerBodyGrad)" stroke="#38BDF8" stroke-width="4"/>

    <!-- Paper Output Slot -->
    <rect x="156" y="270" width="200" height="14" rx="7" fill="#021526" stroke="#0284C7" stroke-width="2"/>

    <!-- Emerging Bottom Paper (Receipt / Price Sheet) -->
    <path d="M 170 280 L 342 280 L 342 370 L 170 370 Z" fill="url(#paperGrad)" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Content lines on receipt -->
    <line x1="190" y1="302" x2="322" y2="302" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
    <line x1="190" y1="322" x2="260" y2="322" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <line x1="285" y1="322" x2="322" y2="322" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <line x1="190" y1="342" x2="250" y2="342" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <line x1="285" y1="342" x2="322" y2="342" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>

    <!-- Zig-zag receipt tear bottom -->
    <polygon points="170,370 178,363 186,370 194,363 202,370 210,363 218,370 226,363 234,370 242,363 250,370 258,363 266,370 274,363 282,370 290,363 298,370 306,363 314,370 322,363 330,370 338,363 342,367 342,370" fill="url(#paperGrad)"/>

    <!-- Printer Controls & LED -->
    <circle cx="155" cy="225" r="7" fill="#10B981"/>
    <circle cx="180" cy="225" r="6" fill="#38BDF8"/>
    <rect x="330" y="218" width="38" height="14" rx="7" fill="#334155" stroke="#64748B" stroke-width="2"/>

    <!-- Display / Print Badge Top-Right -->
    <circle cx="395" cy="130" r="42" fill="url(#cyanAccent)" stroke="#FFFFFF" stroke-width="4"/>
    <!-- Document / Tag Icon inside badge -->
    <path d="M 382 110 L 404 110 L 414 120 L 414 148 L 382 148 Z" fill="#FFFFFF"/>
    <line x1="389" y1="126" x2="407" y2="126" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="389" y1="134" x2="407" y2="134" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="389" y1="141" x2="402" y2="141" stroke="#0284C7" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Bottom Pill Badge "CETAK" -->
  <rect x="121" y="392" width="270" height="68" rx="34" fill="#0284C7" fill-opacity="0.22" stroke="#38BDF8" stroke-width="3"/>
  <text x="256" y="438" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="32" text-anchor="middle" letter-spacing="2">CETAK</text>
</svg>
