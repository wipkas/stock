<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradStore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A0F1E"/>
    </linearGradient>
    <linearGradient id="awningGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadowStore" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3B82F6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background App Icon Shape (Squircle 512x512) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradStore)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#4F8EF7" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Store Building -->
  <g filter="url(#shadowStore)">
    <!-- Building Body -->
    <rect x="126" y="190" width="260" height="150" rx="16" fill="#1E293B" stroke="#3B82F6" stroke-width="4"/>
    
    <!-- Awning / Roof -->
    <polygon points="106,190 120,140 392,140 406,190" fill="url(#awningGrad)" stroke="#93C5FD" stroke-width="3"/>
    <!-- Stripes -->
    <polygon points="145,140 175,140 170,190 140,190" fill="#DBEAFE" opacity="0.85"/>
    <polygon points="210,140 240,140 235,190 205,190" fill="#DBEAFE" opacity="0.85"/>
    <polygon points="275,140 305,140 300,190 270,190" fill="#DBEAFE" opacity="0.85"/>
    <polygon points="340,140 370,140 365,190 335,190" fill="#DBEAFE" opacity="0.85"/>

    <!-- Windows -->
    <rect x="156" y="215" width="56" height="56" rx="8" fill="#93C5FD" opacity="0.85" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="184" y1="215" x2="184" y2="271" stroke="#1E293B" stroke-width="3"/>
    <line x1="156" y1="243" x2="212" y2="243" stroke="#1E293B" stroke-width="3"/>

    <rect x="300" y="215" width="56" height="56" rx="8" fill="#93C5FD" opacity="0.85" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="328" y1="215" x2="328" y2="271" stroke="#1E293B" stroke-width="3"/>
    <line x1="300" y1="243" x2="356" y2="243" stroke="#1E293B" stroke-width="3"/>

    <!-- Door -->
    <rect x="230" y="250" width="52" height="90" rx="8" fill="url(#doorGrad)" stroke="#BFDBFE" stroke-width="3"/>
    <circle cx="270" cy="295" r="4" fill="#FFFFFF"/>

    <!-- Active Badge Top-Right -->
    <circle cx="380" cy="135" r="44" fill="#10B981" stroke="#FFFFFF" stroke-width="4"/>
    <polyline points="364,135 376,147 396,125" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom Pill Badge "CABANG" -->
  <rect x="121" y="392" width="270" height="68" rx="34" fill="#4F8EF7" fill-opacity="0.2" stroke="#4F8EF7" stroke-width="3"/>
  <text x="256" y="438" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="32" text-anchor="middle" letter-spacing="2">CABANG</text>
</svg>
