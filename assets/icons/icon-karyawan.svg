<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradKaryawan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadowKaryawan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background App Icon Shape (Squircle 512x512) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradKaryawan)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10B981" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Cashier Avatar Artwork -->
  <g filter="url(#shadowKaryawan)">
    <!-- Head -->
    <circle cx="256" cy="155" r="52" fill="url(#avatarGrad)" stroke="#A7F3D0" stroke-width="4"/>
    
    <!-- Torso / Shoulders -->
    <path d="M 146 320 C 146 250, 366 250, 366 320 Z" fill="#047857" stroke="#6EE7B7" stroke-width="4"/>

    <!-- ID Badge / Card on Chest -->
    <rect x="230" y="240" width="52" height="68" rx="8" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="2"/>
    <rect x="240" y="248" width="32" height="24" rx="4" fill="#059669"/>
    <line x1="240" y1="282" x2="272" y2="282" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
    <line x1="240" y1="292" x2="264" y2="292" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Lanyard -->
    <polyline points="238,240 256,220 274,240" fill="none" stroke="#F59E0B" stroke-width="3"/>

    <!-- Shift / Key Badge Top-Right -->
    <circle cx="380" cy="135" r="44" fill="#4F8EF7" stroke="#FFFFFF" stroke-width="4"/>
    <!-- Shield / Check in Badge -->
    <path d="M 380 112 L 398 122 C 398 142, 380 156, 380 156 C 380 156, 362 142, 362 122 Z" fill="#FFFFFF"/>
    <polyline points="372,134 378,140 388,128" fill="none" stroke="#4F8EF7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom Pill Badge "KASIR" -->
  <rect x="121" y="392" width="270" height="68" rx="34" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="3"/>
  <text x="256" y="438" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="32" text-anchor="middle" letter-spacing="2">KASIR</text>
</svg>
