<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSP Check - Redirecting...</title>
    <meta http-equiv="refresh" content="0; url=interactive_stock.html">
    <script>
        (function() {
            var target = "interactive_stock.html" + window.location.search + window.location.hash;
            window.location.replace(target);
        })();
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body {
            background-color: #0F1117;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .container {
            background: #181C27;
            border: 1px solid #262B3D;
            border-radius: 16px;
            padding: 32px 28px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(79, 142, 247, 0.2);
            border-top-color: #4F8EF7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 18px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 { font-size: 17px; font-weight: 700; margin-bottom: 8px; color: #FFFFFF; }
        p { font-size: 13px; color: #8A92A6; margin-bottom: 18px; line-height: 1.5; }
        a {
            display: inline-block;
            background: #4F8EF7;
            color: #FFFFFF;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        a:hover { background: #3B7ADF; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Membuka KSP Check Stock...</h1>
        <p>Anda sedang dialihkan ke dashboard interaktif stok &amp; order.</p>
        <a id="redirectLink" href="interactive_stock.html">Buka Aplikasi Manual &rarr;</a>
    </div>
    <script>
        var btn = document.getElementById('redirectLink');
        if (btn) {
            btn.href = "interactive_stock.html" + window.location.search + window.location.hash;
        }
    </script>
</body>
</html>
