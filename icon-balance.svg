<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Wallet / Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Coin / Gold Glow Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Lightning / Pulse Glow -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06B6D4" flood-opacity="0.35"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background App Icon Shape (Squircle 512x512) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.25"/>

  <!-- Back Card / Glow Shape -->
  <rect x="96" y="126" width="320" height="200" rx="28" fill="#1E293B" stroke="#0284C7" stroke-width="3" stroke-opacity="0.5" opacity="0.7" transform="rotate(-6 256 226)"/>

  <!-- Main Front Card (Wallet / Account Card) -->
  <g filter="url(#shadow)">
    <rect x="86" y="160" width="340" height="216" rx="28" fill="url(#cardGrad)"/>
    <!-- Card Gloss Overlay -->
    <path d="M 86 188 C 86 172.5 98.5 160 114 160 L 402 160 C 417.5 160 426 172.5 426 188 L 426 230 C 310 240 210 210 86 280 Z" fill="#FFFFFF" opacity="0.16"/>

    <!-- EMV Chip / Balance Sensor -->
    <rect x="126" y="200" width="52" height="40" rx="8" fill="#FEF08A" stroke="#CA8A04" stroke-width="2"/>
    <line x1="126" y1="220" x2="178" y2="220" stroke="#CA8A04" stroke-width="1.5"/>
    <line x1="152" y1="200" x2="152" y2="240" stroke="#CA8A04" stroke-width="1.5"/>

    <!-- Contactless Wave / Signal -->
    <path d="M 198 208 C 204 214 204 226 198 232" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 208 202 C 218 212 218 238 208 248" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Card Brand Text / Rp Symbol -->
    <text x="386" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="end" opacity="0.95">Rp</text>

    <!-- Balance Numbers Placeholder Bars -->
    <rect x="126" y="278" width="130" height="18" rx="9" fill="#FFFFFF" opacity="0.9"/>
    <rect x="126" y="312" width="70" height="12" rx="6" fill="#FFFFFF" opacity="0.5"/>
    <rect x="206" y="312" width="50" height="12" rx="6" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Realtime Lightning Bolt / Live Coin Badge -->
  <g filter="url(#shadow)">
    <!-- Circular Badge Base -->
    <circle cx="360" cy="356" r="62" fill="url(#coinGrad)" stroke="#A7F3D0" stroke-width="4"/>
    <!-- Live Pulse Lightning Bolt -->
    <path d="M 364 306 L 334 354 L 358 354 L 350 404 L 388 348 L 362 348 Z" fill="url(#boltGrad)" stroke="#78350F" stroke-width="2" stroke-linejoin="round" filter="url(#glow)"/>
  </g>
</svg>
